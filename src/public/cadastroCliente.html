
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scr/">
    <title>Cadastro de Clientes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #245c43;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #19432f;
        }

        #mensagem {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cadastro de Clientes</h1>

        <form id="formCliente">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required>

            <label for="saldo">Saldo:</label>
            <input type="number" id="saldo" step="0.01" min="0" required>

            <button type="submit">Cadastrar Cliente</button>

        </form>

        <p id="mensagem"></p>

    </div>

    <script>

        const formCliente = document.getElementById("formCliente");

        formCliente.addEventListener("submit", async (event) => {

            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const saldo = document.getElementById("saldo").value;

            const cliente = {
                nome,
                email,
                senha,
                saldo
            };

            try {

                const resposta = await fetch("http://localhost:3333/paginaDoCliente", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(cliente)
                });

                const resultado = await resposta.json();

                document.getElementById("mensagem").innerText = resultado;

                if (resposta.ok) {
                    formCliente.reset();
                }

            } catch (erro) {

                document.getElementById("mensagem").innerText =
                    "Erro ao cadastrar cliente!";

                console.log(erro);

            }

        });

    </script>

</body>
</html>
